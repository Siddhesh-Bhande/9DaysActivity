<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niki's Activities App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <audio
      id="pieceClickSound"
      src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
      preload="auto"
    ></audio>
    <audio
      id="pieceSnapSound"
      src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3"
      preload="auto"
    ></audio>
    <audio
      id="puzzleCompleteSound"
      src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"
      preload="auto"
    ></audio>
  </head>
  <body class="bg-gray-100">
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white">
      <!-- Header -->
      <header
        class="bg-purple-600 text-white p-4 fixed top-0 w-full max-w-md z-50"
      >
        <h1 class="text-xl font-bold text-center">Niki's Activities</h1>
        <div id="points-display" class="absolute top-4 right-4">
          <i class="fas fa-star"></i> <span id="points">0</span>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="mt-16 mb-16 p-4" id="main-content">
        <!-- Content will be dynamically loaded here -->
      </main>

      <!-- Bottom Navigation -->
      <nav
        class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 p-2"
      >
        <div class="flex justify-around">
          <button onclick="showHome()" class="p-2 text-purple-600">
            <i class="fas fa-home"></i>
          </button>
          <button onclick="showCategories()" class="p-2 text-purple-600">
            <i class="fas fa-th-large"></i>
          </button>
          <button onclick="showAchievements()" class="p-2 text-purple-600">
            <i class="fas fa-trophy"></i>
          </button>
          <button onclick="showProfile()" class="p-2 text-purple-600">
            <i class="fas fa-user"></i>
          </button>
        </div>
      </nav>
    </div>

    <script src="app.js"></script>
    <script src="activities.js"></script>
  </body>
</html>
